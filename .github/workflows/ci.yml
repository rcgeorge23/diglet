name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/

  tag-release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tag-release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine next version
        id: version
        run: |
          if git log -1 --pretty=%s | grep -qE '^Release [0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "HEAD is a release commit; nothing to release."
            exit 0
          fi
          latest=$(git tag --list 'v*' --sort=-v:refname | head -1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          next="$major.$minor.$((patch + 1))"
          if git rev-parse "v$next" >/dev/null 2>&1; then
            echo "Tag v$next already exists; nothing to release."
            exit 0
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/^version=.*$/version=$VERSION/" gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "Release $VERSION"
          git push origin main
          git tag "v$VERSION"
          git push origin "v$VERSION"

  publish:
    needs: tag-release
    if: needs.tag-release.outputs.version != ''
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.tag-release.outputs.version }}
    secrets: inherit
