name: Embedded Lightpanda integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/embedded-lightpanda.yml'
      - 'gradle/build-lightpanda-c-api.sh'
      - 'gradle/embedded-lightpanda.gradle'
      - 'build.gradle'
      - 'src/main/java/io/github/rcgeorge23/diglet/**'
      - 'src/embeddedLightpandaTest/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/embedded-lightpanda.yml'
      - 'gradle/build-lightpanda-c-api.sh'
      - 'gradle/embedded-lightpanda.gradle'
      - 'build.gradle'
      - 'src/main/java/io/github/rcgeorge23/diglet/**'
      - 'src/embeddedLightpandaTest/**'

permissions:
  contents: read

jobs:
  embedded-lightpanda:
    name: Build pinned native library and run WebTest
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Diglet
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y wget xz-utils ca-certificates clang make git curl

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Prepare Zig 0.16 zip-fetch cache
        run: mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-$HOME/.cache/zig}/tmp"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Build pinned liblightpanda
        run: ./gradle/build-lightpanda-c-api.sh

      - name: Run embedded integration tests
        run: |
          env -u LD_PRELOAD \
            LIGHTPANDA_LIBRARY="$HOME/.cache/diglet/lightpanda-c-api/zig-out/lib/liblightpanda.so" \
            ./gradlew --no-daemon embeddedLightpandaTest

      - name: Upload embedded test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedded-lightpanda-test-reports
          path: |
            build/test-results/embeddedLightpandaTest
            build/reports/tests/embeddedLightpandaTest
